[package]
name = "pahe"
version = "0.1.0"
description = "Desktop client for animepahe"
authors = ["Muhammad Mugni Hadi"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "pahe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-proxy"] }
tauri-plugin-single-instance = "2"
url = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

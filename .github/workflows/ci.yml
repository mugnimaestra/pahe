name: CI

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux dependencies
        # The Azure apt mirror on hosted runners can stall (actions/runner-images#14594).
        # Skip it, run apt-get itself under timeout (so a kill frees the lock), and fail loudly.
        timeout-minutes: 15
        run: |
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            sudo timeout --kill-after=30s 240 apt-get "${APT_OPTS[@]}" update && break
            echo "::warning::apt-get update attempt $attempt failed"
          done
          sudo timeout --kill-after=30s 480 apt-get "${APT_OPTS[@]}" install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils dbus-x11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: app,dmg
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # The Azure apt mirror on hosted runners can stall (actions/runner-images#14594).
        # Skip it, run apt-get itself under timeout (so a kill frees the lock), and fail loudly.
        timeout-minutes: 15
        run: |
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            sudo timeout --kill-after=30s 240 apt-get "${APT_OPTS[@]}" update && break
            echo "::warning::apt-get update attempt $attempt failed"
          done
          sudo timeout --kill-after=30s 480 apt-get "${APT_OPTS[@]}" install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils dbus-x11

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned bundles
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles ${{ matrix.bundles }}

      - name: Cold start smoke
        uses: ./.github/actions/cold-start-smoke

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: pahe-${{ matrix.platform }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
